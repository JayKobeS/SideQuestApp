version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sidequest_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sidequest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sidequest_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: sidequest_backend
    ports:
      - "8000:8000"
    environment:
      # Zgodnie z wymogami: zmienne środowiskowe zamiast hardcodowanych URL-i
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/sidequest
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_zmien_w_produkcji
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: fastapi dev api/main.py --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
  redis_data: